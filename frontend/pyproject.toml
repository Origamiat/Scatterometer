[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scatterometer-frontend"
version = "0.1.0"
description = "High-speed scatterometry data acquisition and visualization UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",      
    "pyqtgraph>=0.13.3",   
    "pyserial>=3.5",       
    "numpy>=1.24.0", 
    "qt-material"  
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8"
]